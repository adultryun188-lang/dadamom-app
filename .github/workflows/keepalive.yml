# 무료 플랜 Supabase 는 일주일간 요청이 없으면 프로젝트를 일시정지한다.
# 정지되면 화면은 뜨지만 로그인·글·기록이 전부 실패한다(2026-10-14 실제로 겪음).
# 3일마다 운영 API 에 가벼운 읽기 요청을 보내 정지를 막고, 실패하면 이 작업이
# 빨간색으로 끝나 GitHub 이 메일로 알려준다.
# 키는 여기 적지 않고 배포된 index.html 에서 그때그때 읽는다 (공개용 anon 키).
# shortcut: 저장소에 60일간 활동이 없으면 GitHub 이 예약 작업을 끈다 — 그때는 Actions 탭에서 다시 켜거나 Pro 플랜으로 전환.
name: keep supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 운영 API 읽기 요청
        run: |
          page=$(curl -fsSL https://dadamom.co.kr/index.html)   # 2026-10-19 도메인 이전 뒤 옛 주소는 301 이라 -L 없이 읽으면 실패
          url=$(printf '%s' "$page" | grep -o "var SUPABASE_URL = '[^']*'" | cut -d"'" -f2)
          key=$(printf '%s' "$page" | grep -o "var SUPABASE_KEY = '[^']*'" | cut -d"'" -f2)
          test -n "$url" && test -n "$key"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/rest/v1/community_posts?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "HTTP $code"
          test "$code" = 200
